<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Concept: phone-case pill container</title>
  <desc id="d">Concept illustration of a silicone phone case with a central pill module, and a cutaway showing spring, stop barrier, and count gauge. Not a working device.</desc>
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaec"/>
      <stop offset="1" stop-color="#9fd0d4"/>
    </linearGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a8a90"/>
      <stop offset="1" stop-color="#155359"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="#f5f7f8"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1f2933">Phone-case pill container (concept)</text>
  <text x="40" y="66" font-family="system-ui, sans-serif" font-size="13" fill="#5b6670">Illustration only. Not a working device. Pill sensing, connectivity, and durability are unproven.</text>

  <!-- Left: rear view of phone in silicone case with pill module -->
  <text x="40" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2933">Rear view, attached</text>
  <rect x="268" y="110" width="264" height="390" rx="42" fill="url(#case)" stroke="#1d6f75" stroke-width="3"/>
  <rect x="290" y="132" width="220" height="346" rx="30" fill="#2b333b"/>
  <rect x="312" y="150" width="78" height="78" rx="18" fill="#3a444e"/>
  <circle cx="335" cy="173" r="13" fill="#11161b"/>
  <circle cx="368" cy="173" r="13" fill="#11161b"/>
  <circle cx="335" cy="206" r="13" fill="#11161b"/>
  <rect x="330" y="300" width="100" height="150" rx="16" fill="url(#pod)"/>
  <rect x="342" y="316" width="76" height="90" rx="10" fill="#e6f4f5" opacity="0.92"/>
  <circle cx="356" cy="332" r="9" fill="#f2b84b"/>
