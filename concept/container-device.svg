  <rect x="436" y="318" width="8" height="30" rx="4" fill="#1d6f75"/>
  <text x="250" y="520" font-family="system-ui, sans-serif" font-size="13" fill="#5b6670">Pill module shown in teal; count window and gauge on right edge.</text>

