  <path d="M 810 240 l 10 -12 l 10 24 l 10 -24 l 10 24 l 10 -24 l 10 24 l 10 -24 l 10 12" fill="none" stroke="#1d6f75" stroke-width="3" stroke-linejoin="round"/>
  <rect x="800" y="160" width="12" height="120" rx="4" fill="#8a97a1"/>
  <text x="560" y="350" font-family="system-ui, sans-serif" font-size="12" fill="#5b6670">Red: stop barrier (stops pills leaving the chamber).</text>
  <text x="560" y="368" font-family="system-ui, sans-serif" font-size="12" fill="#5b6670">Zigzag: spring-loaded plunger with tension gauge.</text>
  <text x="560" y="386" font-family="system-ui, sans-serif" font-size="12" fill="#5b6670">Yellow: pills in chamber (count estimated from spring tension).</text>
</svg>
